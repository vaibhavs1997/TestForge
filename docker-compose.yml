services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testforge-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/testforge.db
      - BACKUP_DIR=/app/data/backups
      - PERSISTENCE_DRIVER=json
      # Current repository set is single-node JSON/file persistence.
      - TESTFORGE_ALLOW_SINGLE_NODE_JSON=true
    volumes:
      - testforge-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/ready', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - testforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testforge-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testforge-network

volumes:
  testforge-data:
    driver: local

networks:
  testforge-network:
    driver: bridge
