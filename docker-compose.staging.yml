services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testforge-backend-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      # Staging intentionally uses production validation and runtime behavior.
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/testforge.db
      - BACKUP_DIR=/app/data/backups
      - PERSISTENCE_DRIVER=json
      - TESTFORGE_ALLOW_SINGLE_NODE_JSON=true
    volumes:
      - testforge-staging-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/ready', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - testforge-network-staging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testforge-frontend-staging
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testforge-network-staging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.testforge-frontend-staging.rule=Host(`${STAGING_DOMAIN:-staging.testforge.local}`)"
      - "traefik.http.services.testforge-frontend-staging.loadbalancer.server.port=80"

volumes:
  testforge-staging-data:
    driver: local

networks:
  testforge-network-staging:
    driver: bridge
