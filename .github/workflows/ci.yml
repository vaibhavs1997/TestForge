name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-build:
    name: Backend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build:backend

      - name: Type check
        run: npm run typecheck --workspace backend

      - name: Backend tests and coverage gate
        run: npm run test:coverage --workspace backend

      - name: Compiled backend startup smoke
        run: npm run smoke:compiled --workspace backend

      - name: Lint
        run: npm run lint --workspace backend

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build:frontend

      - name: Type check
        run: npm run typecheck --workspace frontend

      - name: Frontend tests and coverage gate
        run: npm run test:coverage --workspace frontend

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  production-e2e:
    name: Production E2E Gate
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production-artifact E2E gate
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit backend dependencies
        run: npm audit --audit-level=high --omit=dev --workspace backend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high --omit=dev --workspace frontend

  docker-build:
    name: Docker Image Validation
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t testforge-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t testforge-frontend:ci ./frontend

      - name: Validate docker-compose
        run: |
          cp .env.staging.example .env
          cp .env.staging.example .env.staging
          docker compose config --quiet
          docker compose -f docker-compose.staging.yml config --quiet
